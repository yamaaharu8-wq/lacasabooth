<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aktivasi - Lacasabooth</title>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --ink: #0f172a;
            --paper-white: #f8fafc;
            --yellow: #facc15;
            --blue: #38bdf8;
            --pink: #f472b6;
            --green: #4ade80;
            --bg-color: #e2e8f0;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body { 
            font-family: 'Fredoka', sans-serif; 
            background-color: var(--bg-color); 
            background-image: radial-gradient(#cbd5e1 2px, transparent 2px);
            background-size: 30px 30px;
            display: flex; justify-content: center; align-items: center; 
            min-height: 100vh; overflow: hidden;
        }

        /* Container Utama */
        .login-wrapper {
            display: flex; width: 950px; max-width: 95%; 
            background: var(--paper-white); 
            border-radius: 30px; overflow: hidden; 
            box-shadow: 12px 12px 0px var(--ink); 
            border: 4px solid var(--ink);
            animation: popIn 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes popIn {
            0% { transform: scale(0.9); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        /* Sisi Kiri (Branding) */
        .login-left {
            flex: 1; background: var(--yellow); padding: 50px;
            display: flex; flex-direction: column; justify-content: center;
            border-right: 4px solid var(--ink); position: relative;
        }
        .login-left h1 { font-family: 'Caveat', cursive; font-size: 4.5rem; color: var(--ink); line-height: 1; margin-bottom: 10px; }
        .login-left p { font-size: 1.1rem; color: var(--ink); font-weight: 500; opacity: 0.9; margin-bottom: 30px; }
        
        .feature-list { display: flex; flex-direction: column; gap: 15px; }
        .feature-item { background: white; padding: 12px 20px; border-radius: 15px; border: 3px solid var(--ink); font-weight: 600; display: flex; align-items: center; gap: 10px; box-shadow: 4px 4px 0px var(--ink); }

        /* Sisi Kanan (Form) */
        .login-right {
            flex: 1; padding: 50px; display: flex; flex-direction: column; justify-content: center;
            background: var(--paper-white);
        }
        .login-right h2 { font-size: 2.2rem; color: var(--ink); margin-bottom: 5px; }
        .login-right p.sub-title { font-size: 0.95rem; color: #64748b; margin-bottom: 30px; font-weight: 500; }

        .form-group { margin-bottom: 20px; text-align: left; }
        .form-group label { display: block; font-weight: 700; color: var(--ink); margin-bottom: 8px; font-size: 0.95rem; }
        .form-group input { 
            width: 100%; padding: 15px; border-radius: 15px; 
            border: 3px solid var(--ink); background: white; 
            font-family: inherit; font-size: 1rem; font-weight: 500; 
            outline: none; transition: 0.2s; box-shadow: inset 4px 4px 0px rgba(0,0,0,0.03);
        }
        .form-group input:focus { border-color: var(--blue); box-shadow: 4px 4px 0px var(--ink); transform: translate(-2px, -2px); }

        .btn-submit {
            width: 100%; background: var(--ink); color: white; border: 3px solid var(--ink);
            padding: 15px; border-radius: 15px; font-size: 1.1rem; font-weight: 700; font-family: inherit;
            cursor: pointer; transition: 0.2s; box-shadow: 5px 5px 0px var(--blue);
            display: flex; justify-content: center; align-items: center; gap: 10px;
        }
        .btn-submit:hover { transform: translate(-3px, -3px); box-shadow: 8px 8px 0px var(--blue); }
        .btn-submit:active { transform: translate(0, 0); box-shadow: 0px 0px 0px var(--blue); }

        .divider { display: flex; align-items: center; text-align: center; margin: 25px 0; color: #94a3b8; font-weight: 600; font-size: 0.85rem; }
        .divider::before, .divider::after { content: ''; flex: 1; border-bottom: 2px dashed #cbd5e1; }
        .divider:not(:empty)::before { margin-right: 15px; }
        .divider:not(:empty)::after { margin-left: 15px; }

        .btn-google {
            width: 100%; background: white; color: var(--ink); border: 3px solid var(--ink);
            padding: 12px; border-radius: 15px; font-size: 1rem; font-weight: 700; font-family: inherit;
            cursor: pointer; transition: 0.2s; box-shadow: 4px 4px 0px var(--ink);
            display: flex; justify-content: center; align-items: center; gap: 10px;
        }
        .btn-google:hover { background: #f1f5f9; transform: translate(-2px, -2px); box-shadow: 6px 6px 0px var(--ink); }

        .footer-text { text-align: center; margin-top: 25px; font-size: 0.85rem; color: #64748b; font-weight: 500; }
        .footer-text a { color: var(--blue); font-weight: 700; text-decoration: none; }
        
        /* Pesan Error/Sukses */
        #alert-box { display: none; padding: 12px; border-radius: 10px; margin-bottom: 20px; font-weight: 600; font-size: 0.9rem; text-align: center; border: 2px solid; }
        .alert-error { background: #fee2e2; color: #991b1b; border-color: #ef4444; }
        .alert-success { background: #dcfce3; color: #166534; border-color: #22c55e; }

        @media (max-width: 768px) {
            .login-wrapper { flex-direction: column; }
            .login-left { border-right: none; border-bottom: 4px solid var(--ink); padding: 30px; }
            .login-right { padding: 30px; }
        }
    </style>
</head>
<body>

    <div class="login-wrapper">
        <!-- Sisi Kiri (Branding) -->
        <div class="login-left">
            <h1>Lacasabooth.</h1>
            <p>Platform Photobooth Modern untuk Bisnis Anda.</p>
            
            <div class="feature-list">
                <div class="feature-item">📸 Multi-Mode (Self Studio & Collage)</div>
                <div class="feature-item">💸 Integrasi QRIS & Payment Gateway</div>
                <div class="feature-item">☁️ Cloud Auto-Sync ke Google Drive</div>
            </div>
        </div>

        <!-- Sisi Kanan (Form) -->
        <div class="login-right">
            <h2>Masuk ke Akun</h2>
            <p class="sub-title">Aktivasi mesin photobooth Anda sekarang.</p>

            <div id="alert-box"></div>

            <form id="loginForm">
                <div class="form-group">
                    <label>Email Pengguna</label>
                    <input type="email" id="inputEmail" placeholder="contoh@lacasaphoto.com" required>
                </div>
                
                <div class="form-group">
                    <label>Password / Kode Lisensi</label>
                    <input type="password" id="inputPassword" placeholder="••••••••" required>
                </div>

                <button type="submit" class="btn-submit" id="btnMasuk">
                    Aktivasi Mesin ›
                </button>
            </form>

            <div class="divider">ATAU</div>

            <button type="button" class="btn-google" onclick="loginDenganGoogle()">
                <svg width="20" height="20" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
                    <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
                    <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
                    <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
                </svg>
                Masuk dengan Google
            </button>

            <div class="footer-text">
                Belum punya akun lisensi? <a href="#" onclick="alert('Silakan hubungi Admin Lacasaphoto untuk membeli paket lisensi langganan Anda!')">Daftar Berlangganan</a>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const email = document.getElementById('inputEmail').value;
            const password = document.getElementById('inputPassword').value;
            const btn = document.getElementById('btnMasuk');
            const alertBox = document.getElementById('alert-box');

            // Ubah tombol jadi loading
            btn.innerHTML = '⏳ Memvalidasi...';
            btn.style.opacity = '0.7';
            btn.disabled = true;
            alertBox.style.display = 'none';

            try {
                // Nanti kita akan panggil API login yang ada di server.js
                const res = await fetch('/api/login-license', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: email, password: password })
                });
                
                const data = await res.json();

                if (data.success) {
                    // Jika sukses login
                    alertBox.className = 'alert-success';
                    alertBox.innerHTML = '✅ Aktivasi Berhasil! Mengalihkan...';
                    alertBox.style.display = 'block';
                    
                    // Arahkan ke Layar Utama / Idle (atau Admin)
                    setTimeout(() => {
                        window.location.href = '/idle.html'; 
                    }, 1500);
                } else {
                    // Jika gagal login (Email salah/Lisensi Habis)
                    tampilkanError(data.message || 'Email atau Kode Lisensi salah!');
                }
            } catch (err) {
                // Jika server.js sedang mati atau error koneksi
                tampilkanError('Koneksi ke server gagal. Coba lagi.');
            }
        });

        function tampilkanError(pesan) {
            const btn = document.getElementById('btnMasuk');
            const alertBox = document.getElementById('alert-box');
            
            btn.innerHTML = 'Aktivasi Mesin ›';
            btn.style.opacity = '1';
            btn.disabled = false;
            
            alertBox.className = 'alert-error';
            alertBox.innerHTML = `⚠️ ${pesan}`;
            alertBox.style.display = 'block';
        }

        function loginDenganGoogle() {
            // Nanti ini bisa kita arahkan ke API OAuth Google di server.js
            alert("Fitur Login Google akan segera diaktifkan!");
        }
    </script>
</body>
</html>
