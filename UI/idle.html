<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lacasabooth.id - Touch to Start</title>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600;700&family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Panggil Tema Terpusat -->
    <link rel="stylesheet" href="/assets/theme.css">
    
    <style>
        html, body {
            margin: 0; padding: 0; width: 100vw; height: 100vh;
            overflow: hidden; 
            background-color: var(--bg-color); 
            color: var(--ink);
            font-family: 'Fredoka', sans-serif; 
            user-select: none;
            display: flex;
            align-items: center;
            justify-content: center;
            background-image: radial-gradient(var(--dot-color) 2px, transparent 2px);
            background-size: 40px 40px;
        }

        /* --- ORNAMEN DOODLE MENGAMBANG --- */
        .doodle-asset { position: absolute; pointer-events: none; z-index: 1; }
        .doodle-flags { top: 0; left: 0; width: 250px; }
        .doodle-smile { top: 8%; right: 15%; width: 120px; animation: float 4s infinite ease-in-out; }
        .doodle-smile-text {
            position: absolute; top: 12%; right: 17%;
            font-family: 'Caveat', cursive; font-size: 2rem; color: var(--ink);
            transform: rotate(5deg); pointer-events: none; animation: float 4s infinite ease-in-out;
        }
        .doodle-cloud { top: 30%; right: 8%; width: 130px; animation: float 6s infinite ease-in-out 1s; }
        .doodle-star { top: 50%; right: 25%; width: 30px; animation: pop 2s infinite alternate; }
        .doodle-strip { bottom: 5%; left: 8%; width: 160px; transform: rotate(-10deg); animation: float 5s infinite ease-in-out reverse; }
        .doodle-polaroid { bottom: 5%; right: 10%; width: 180px; transform: rotate(5deg); animation: float 5s infinite ease-in-out 0.5s; }
        .doodle-heart-1 { top: 15%; left: 30%; width: 25px; }
        .doodle-heart-2 { bottom: 35%; right: 35%; width: 20px; }
        
        @keyframes float {
            0% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-15px) rotate(3deg); }
            100% { transform: translateY(0px) rotate(0deg); }
        }
        @keyframes pop {
            0% { transform: scale(0.9); opacity: 0.8; }
            100% { transform: scale(1.1); opacity: 1; }
        }

        /* --- KONTEN UTAMA (TENGAH) --- */
        .main-content {
            z-index: 10; display: flex; flex-direction: column;
            align-items: center; text-align: center; gap: 10px;
            cursor: pointer; position: relative; width: 100%; height: 100vh;
            justify-content: center;
        }
        .top-camera-icon { width: 90px; margin-bottom: -10px; }
        .brand-wrapper { position: relative; display: inline-block; margin-bottom: 5px; }
        .brand-blob {
            position: absolute; top: 30%; left: 5%; width: 90%; height: 60%;
            background: var(--paper-white); border-radius: 50px; z-index: -1; transform: rotate(-2deg);
        }
        .brand-title { font-size: 6.5rem; font-weight: 600; color: var(--ink); margin: 0; line-height: 1.1; letter-spacing: -1px; }
        .brand-title span { font-size: 5rem; }
        .subtitle { font-family: 'Caveat', cursive; font-size: 2.2rem; color: var(--ink); margin: 0 0 30px 0; line-height: 1.2; }
        
        /* --- TOMBOL TAP TO START --- */
        .btn-start {
            position: relative; 
            background: transparent; /* Warna dikosongkan agar layer di bawahnya terlihat */
            color: var(--ink);
            border: 4px solid var(--ink); border-radius: 50px;
            padding: 18px 60px; font-size: 2.5rem; font-family: 'Caveat', cursive; font-weight: 700;
            display: flex; align-items: center; gap: 15px; cursor: pointer;
            animation: pulseBtn 1.5s infinite alternate ease-in-out; 
            pointer-events: none; /* Klik tembus ke .main-content */
            z-index: 1; /* Memastikan tumpukan layer rapi */
        }

        /* Lapisan 1: Background Pink (Tepat di belakang teks & border) */
        .btn-start::before {
            content: ""; position: absolute; 
            top: -4px; left: -4px; /* Ditarik mundur sedikit untuk menutupi ketebalan border */
            width: calc(100% + 8px); height: calc(100% + 8px);
            background: var(--pink);
            border-radius: 50px;
            z-index: -1;
        }
        
        /* Lapisan 2: Efek garis bayangan arsir (Di posisi paling belakang) */
        .btn-start::after {
            content: ""; position: absolute; 
            top: 10px; left: 10px; /* Jarak jatuhnya bayangan */
            width: calc(100% + 8px); height: calc(100% + 8px); 
            border: 4px solid var(--ink); border-radius: 50px;
            background: repeating-linear-gradient(45deg, transparent, transparent 5px, var(--ink) 5px, var(--ink) 7px);
            z-index: -2;
        }

        @keyframes pulseBtn {
            0% { transform: scale(1); }
            100% { transform: scale(1.03); }
        }
        
        /* Tombol Admin */
        .btn-admin {
            position: absolute; top: 20px; right: 20px; z-index: 50;
            background: rgba(0,0,0,0.5); border: none; color: white;
            padding: 8px 15px; border-radius: 15px; font-family: 'Fredoka', sans-serif;
            font-size: 0.9rem; cursor: pointer; transition: 0.2s; backdrop-filter: blur(5px);
        }
        .btn-admin:hover { background: var(--pink); color: var(--ink); }

        /* Lapisan Layar Custom */
        #custom-ui-layer {
            position: absolute; top: 0; left: 0; width: 100vw; height: 100vh;
            z-index: 20; display: none; cursor: pointer;
        }

        /* ====================================================
           RESPONSIVE MOBILE (ANDROID & IOS)
           ==================================================== */
        @media (max-width: 768px) {
            .brand-title { font-size: 4.5rem; }
            .brand-title span { font-size: 3rem; }
            .subtitle { font-size: 1.8rem; margin: 0 0 40px 0;}
            
            .btn-start { padding: 15px 40px; font-size: 2rem; }
            
            .doodle-polaroid, .doodle-strip, .doodle-cloud { display: none; }
            .doodle-flags { width: 150px; }
            .doodle-smile { width: 80px; top: 5%; right: 5%; }
            .doodle-smile-text { font-size: 1.3rem; top: 8%; right: 7%; }
            .doodle-star { right: 10%; width: 20px; }
            .doodle-heart-1 { top: 10%; left: 15%; }
            .doodle-heart-2 { bottom: 25%; right: 15%; }
            
            .btn-admin { top: 10px; right: 10px; padding: 6px 12px; font-size: 0.8rem; }
        }
        /* --- UI NUMPAD PIN --- */
.pin-dot { width: 22px; height: 22px; border-radius: 50%; border: 3px solid var(--ink); background: transparent; transition: 0.2s; }
.pin-dot.filled { background: var(--ink); }
.pin-dot.error { border-color: #ef4444; background: #ef4444; animation: shakePin 0.3s; }
.btn-numpad { background: var(--paper-white); border: 3px solid var(--ink); font-size: 1.8rem; font-family: 'Fredoka', sans-serif; font-weight: 700; color: var(--ink); border-radius: 15px; padding: 15px 0; cursor: pointer; transition: 0.1s; box-shadow: 3px 3px 0px var(--ink); }
.btn-numpad:active { transform: translateY(3px); box-shadow: 0px 0px 0px var(--ink); background: var(--yellow); }
.btn-numpad.special { font-size: 1rem; background: #e5e7eb; }
@keyframes shakePin { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }
    </style>
</head>
<body>

    <!-- TOMBOL ADMIN (Selalu Berada Paling Atas) -->
    <button class="btn-admin" onclick="keluarKeAdmin(event)">⚙️ Admin</button>

    <!-- LAPISAN 1: CUSTOM IDLE SCREEN (Muncul jika klien upload file) -->
    <div id="custom-ui-layer" onclick="mulaiSesi()"></div>

    <!-- LAPISAN 2: TEMA BAWAAN (Muncul jika tidak ada file custom) -->
   <div id="default-ui-layer" style="width: 100%; height: 100%; position: absolute; top: 0; left: 0; display: none;">  
        <!-- ORNAMEN DOODLE KIRI ATAS (BENDERA) -->
        <svg class="doodle-asset doodle-flags" viewBox="0 0 250 150">
            <path d="M0 20 Q125 70 250 10" fill="none" stroke="var(--ink)" stroke-width="4"/>
            <polygon points="20,25 45,75 70,30" fill="var(--green)" stroke="var(--ink)" stroke-width="4" stroke-linejoin="round"/>
            <polygon points="90,37 115,85 140,38" fill="var(--pink)" stroke="var(--ink)" stroke-width="4" stroke-linejoin="round"/>
            <polygon points="160,32 185,80 210,25" fill="var(--blue)" stroke="var(--ink)" stroke-width="4" stroke-linejoin="round"/>
        </svg>

        <!-- ORNAMEN DOODLE KANAN ATAS (SMILE) -->
        <svg class="doodle-asset doodle-smile" viewBox="0 0 150 100">
            <path d="M10 50 Q10 10 75 10 Q140 10 140 50 Q140 90 75 90 Q40 90 20 110 L25 80 Q10 70 10 50 Z" fill="var(--paper-white)" stroke="var(--ink)" stroke-width="4" stroke-linejoin="round"/>
            <path d="M80 75 C75 85 65 85 60 75 Z" fill="var(--pink)" stroke="var(--ink)" stroke-width="3"/>
        </svg>
        <div class="doodle-smile-text">smile!</div>

        <!-- ORNAMEN KANAN TENGAH (AWAN) -->
        <svg class="doodle-asset doodle-cloud" viewBox="0 0 150 100">
            <path d="M40 70 A25 25 0 0 1 40 20 A35 35 0 0 1 100 15 A30 30 0 0 1 120 70 Z" fill="var(--blue)" stroke="var(--ink)" stroke-width="4" stroke-linejoin="round"/>
        </svg>

        <!-- ORNAMEN BINTANG & HATI -->
        <svg class="doodle-asset doodle-star" viewBox="0 0 50 50">
            <polygon points="25,5 31,18 45,20 35,30 38,45 25,37 12,45 15,30 5,20 19,18" fill="var(--yellow)" stroke="var(--ink)" stroke-width="3" stroke-linejoin="round"/>
        </svg>
        <svg class="doodle-asset doodle-heart-1" viewBox="0 0 50 50">
            <path d="M25 45 C10 35 5 20 12 10 C18 2 25 10 25 10 C25 10 32 2 38 10 C45 20 40 35 25 45 Z" fill="none" stroke="var(--pink)" stroke-width="4"/>
        </svg>

        <!-- ORNAMEN KIRI BAWAH (PHOTOSTRIP) -->
        <svg class="doodle-asset doodle-strip" viewBox="0 0 120 280">
            <rect x="10" y="10" width="100" height="260" fill="var(--paper-white)" stroke="var(--ink)" stroke-width="4" rx="5"/>
            <rect x="5" y="5" width="110" height="30" fill="var(--green)" stroke="var(--ink)" stroke-width="4" rx="2" transform="rotate(-5 60 20)"/>
            <rect x="20" y="50" width="80" height="60" fill="var(--bg-color)" stroke="var(--ink)" stroke-width="3"/>
            <circle cx="50" cy="75" r="8" fill="none" stroke="var(--ink)" stroke-width="2"/>
            <circle cx="70" cy="75" r="8" fill="none" stroke="var(--ink)" stroke-width="2"/>
            <path d="M50 90 Q60 100 70 90" fill="none" stroke="var(--ink)" stroke-width="2"/>
            <rect x="20" y="120" width="80" height="60" fill="var(--pink)" stroke="var(--ink)" stroke-width="3"/>
            <rect x="20" y="190" width="80" height="60" fill="var(--blue)" stroke="var(--ink)" stroke-width="3"/>
        </svg>

        <!-- ORNAMEN KANAN BAWAH (POLAROID) -->
        <svg class="doodle-asset doodle-polaroid" viewBox="0 0 160 180">
            <rect x="20" y="20" width="120" height="100" fill="var(--paper-white)" stroke="var(--ink)" stroke-width="4" rx="15"/>
            <rect x="20" y="90" width="120" height="20" fill="var(--green)" stroke="var(--ink)" stroke-width="4"/>
            <circle cx="80" cy="60" r="25" fill="var(--bg-color)" stroke="var(--ink)" stroke-width="4"/>
            <circle cx="80" cy="60" r="10" fill="var(--ink)"/>
            <rect x="30" y="30" width="15" height="15" fill="var(--pink)" stroke="var(--ink)" stroke-width="3" rx="3"/>
            <path d="M35 110 L125 110 L140 170 L20 170 Z" fill="var(--paper-white)" stroke="var(--ink)" stroke-width="4" stroke-linejoin="round"/>
            <path d="M45 120 L115 120 L125 160 L35 160 Z" fill="var(--pink)" stroke="var(--ink)" stroke-width="3" stroke-linejoin="round"/>
        </svg>

        <!-- KLIK AREA TEMA BAWAAN -->
        <div class="main-content" onclick="mulaiSesi()">
            <svg class="top-camera-icon" viewBox="0 0 100 80">
                <rect x="10" y="20" width="80" height="55" fill="var(--paper-white)" stroke="var(--ink)" stroke-width="4" rx="10"/>
                <rect x="35" y="5" width="30" height="15" fill="var(--paper-white)" stroke="var(--ink)" stroke-width="4" rx="5"/>
                <circle cx="50" cy="47" r="18" fill="none" stroke="var(--ink)" stroke-width="4"/>
                <circle cx="50" cy="47" r="8" fill="var(--ink)"/>
                <circle cx="25" cy="35" r="4" fill="var(--pink)"/>
            </svg>
            <div class="brand-wrapper">
                <div class="brand-blob"></div>
                <h1 class="brand-title">Lacasabooth<span>.id</span></h1>
            </div>
            <p class="subtitle">
                Capture the <span style="color: var(--pink); font-weight:bold;">moment</span>,<br>
                create the <span style="color: var(--green); font-weight:bold;">memory</span>.
            </p>
            <div class="btn-start">
                <svg width="35" height="35" viewBox="0 0 24 24" fill="none" stroke="var(--ink)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="8" width="18" height="12" rx="2" ry="2"></rect>
                    <path d="M16 8v-2a2 2 0 0 0 -2-2h-4a2 2 0 0 0 -2 2v2"></path>
                    <circle cx="12" cy="14" r="3"></circle>
                </svg>
                Tap to Start
            </div>
        </div>
    </div>

    <script>
        let eventMode = '';
        let eventPayment = '';
        let requirePin = false;
let currentPin = "1234";
let inputPinBuffer = "";

        window.onload = async function() {
            const customLayer = document.getElementById('custom-ui-layer');
            const defaultLayer = document.getElementById('default-ui-layer');

            try {
                // 1. Ambil Pengaturan Global
                const resSettings = await fetch('/api/settings');
                const dataSettings = await resSettings.json();
                
                let isCustomLoaded = false; // Penanda apakah layar custom berhasil ditampilkan

                if (dataSettings.global) {
                    // Terapkan Tema CSS
                    if (dataSettings.global.theme) {
                        document.body.className = dataSettings.global.theme;
                    }
                    requirePin = dataSettings.global.usePin === true;
    currentPin = dataSettings.global.adminPin || "1234";
                    // Eksekusi Logika Hibrida (Custom Idle Screen)
                    if (dataSettings.global.customIdleScreen) {
                        const fileUrl = dataSettings.global.customIdleScreen;

                        // Tampilkan layer custom
                        customLayer.style.display = 'block';
                        isCustomLoaded = true; // Tandai bahwa layar custom aktif

                        // Render Video MP4 atau Gambar JPG/PNG
                        if (fileUrl.toLowerCase().endsWith('.mp4')) {
                            customLayer.innerHTML = `
                                <video autoplay loop muted playsinline style="width:100%; height:100%; object-fit:cover; pointer-events: none;">
                                    <source src="${fileUrl}" type="video/mp4">
                                </video>
                            `;
                        } else {
                            customLayer.innerHTML = `
                                <img src="${fileUrl}" style="width:100%; height:100%; object-fit:cover; pointer-events: none;">
                            `;
                        }
                    }
                }

                // JIKA TIDAK ADA CUSTOM LAYAR (Atau baru saja dihapus), MUNCULKAN BAWAAN TEMA
                if (!isCustomLoaded) {
                    defaultLayer.style.display = 'block';
                }

                // 2. Ambil Status Event (Logika Routing Asli)
                const resEvent = await fetch('/api/current-event');
                const dataEvent = await resEvent.json();
                
                if (dataEvent.success) {
                    eventMode = dataEvent.event.mode; 
                    eventPayment = dataEvent.event.payment; 
                } else {
                    window.location.href = '/event-manager.html';
                }
            } catch (err) {
                console.error("Gagal memuat API:", err);
                
                // JIKA TERJADI ERROR KONEKSI/SERVER, PASTIKAN LAYAR TIDAK BLANK (MUNCULKAN BAWAAN)
                defaultLayer.style.display = 'block';
            }
        };

        function mulaiSesi() {
            if (!eventMode) {
                window.location.href = '/photobox.html'; 
                return;
            }
            if (eventPayment === 'with_payment') {
                window.location.href = '/payment.html'; 
            } else {
                window.location.href = `/${eventMode}.html`;
            }
        }

        function keluarKeAdmin(e) {
    e.stopPropagation(); 
    
    // Jika PIN diaktifkan dari dashboard
    if (requirePin) {
        bukaPinModal();
        return;
    }

    // JIKA TIDAK PAKAI PIN, Jalankan popup konfirmasi biasa (kode asli kamu)
    tampilkanPopupBiasa(e);
}

// Pisahkan popup lama menjadi fungsi sendiri
function tampilkanPopupBiasa(e) {
    const overlay = document.createElement('div');
    overlay.style.cssText = 'position:fixed; top:0; left:0; width:100vw; height:100vh; background:rgba(0,0,0,0.6); z-index:999999; display:flex; align-items:center; justify-content:center; backdrop-filter:blur(5px);';
    
    const box = document.createElement('div');
    box.style.cssText = 'background:var(--paper-white); padding:30px 40px; border-radius:25px; border:4px solid var(--ink); box-shadow:8px 10px 0px var(--ink); text-align:center; animation: pop 0.3s ease; color: var(--ink);';
    box.innerHTML = `
        <h2 style="font-family:'Caveat', cursive; font-size:2.8rem; margin:0 0 5px 0; font-weight: 700;">Admin Panel ⚙️</h2>
        <p style="margin-bottom: 25px; font-weight: 500; opacity: 0.8;">Tinggalkan layar ini dan kembali ke pengaturan?</p>
        <div style="display:flex; gap:15px; justify-content:center;">
            <button id="btn-batal" style="background:var(--bg-color); border:2px solid var(--ink); padding:10px 25px; border-radius:15px; font-weight:600; cursor:pointer; font-family:'Fredoka', sans-serif; font-size: 1rem; transition: 0.2s;">Batal</button>
            <button id="btn-yakin" style="background:var(--pink); border:2px solid var(--ink); padding:10px 25px; border-radius:15px; font-weight:600; cursor:pointer; font-family:'Fredoka', sans-serif; font-size: 1rem; transition: 0.2s; box-shadow: 3px 3px 0px var(--ink);">Yakin</button>
        </div>
    `;
    
    overlay.appendChild(box);
    document.body.appendChild(overlay);
    
    document.getElementById('btn-batal').onclick = (ev) => { ev.stopPropagation(); overlay.remove(); };
    document.getElementById('btn-yakin').onclick = (ev) => { ev.stopPropagation(); overlay.remove(); window.location.href = '/event-manager.html'; };
}
// --- LOGIKA NUMPAD PIN ---
function bukaPinModal() {
    inputPinBuffer = "";
    updatePinDots();
    document.getElementById('pin-error-text').style.visibility = 'hidden';
    document.getElementById('pin-modal-overlay').style.display = 'flex';
}

function tutupPinModal(e) {
    if(e) e.stopPropagation();
    document.getElementById('pin-modal-overlay').style.display = 'none';
}

function tekanNumpad(val, e) {
    if(e) e.stopPropagation();
    document.getElementById('pin-error-text').style.visibility = 'hidden';
    const dots = document.querySelectorAll('.pin-dot');
    dots.forEach(d => d.classList.remove('error'));

    if (val === 'del') {
        inputPinBuffer = inputPinBuffer.slice(0, -1);
    } else if (inputPinBuffer.length < 4) {
        inputPinBuffer += val;
    }

    updatePinDots();

    // Jika sudah 4 angka, validasi
    if (inputPinBuffer.length === 4) {
        setTimeout(() => {
            if (inputPinBuffer === currentPin) {
                // PIN Benar, arahkan ke Event Manager
                window.location.href = '/event-manager.html';
            } else {
                // PIN Salah, tampilkan error & getarkan titik
                document.getElementById('pin-error-text').style.visibility = 'visible';
                dots.forEach(d => d.classList.add('error'));
                inputPinBuffer = "";
                setTimeout(updatePinDots, 400); // Bersihkan titik setelah animasi bergetar selesai
            }
        }, 150); // Jeda singkat agar titik ke-4 terlihat penuh sebelum diproses
    }
}

function updatePinDots() {
    const dots = document.querySelectorAll('.pin-dot');
    dots.forEach((dot, index) => {
        if (index < inputPinBuffer.length) dot.classList.add('filled');
        else dot.classList.remove('filled');
    });
}
    </script>
    <!-- MODAL PIN NUMPAD -->
<div id="pin-modal-overlay" style="display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.8); z-index: 999999; justify-content: center; align-items: center; backdrop-filter: blur(5px);">
    <div style="background: var(--bg-color); padding: 30px; border-radius: 30px; border: 4px solid var(--ink); box-shadow: 10px 12px 0px var(--ink); text-align: center; width: 340px; background-image: radial-gradient(var(--dot-color) 2px, transparent 2px); background-size: 40px 40px;">
        <h2 style="font-family: 'Caveat', cursive; font-size: 3rem; margin: 0 0 10px 0; line-height: 1;">PIN Admin 🔒</h2>
        <div id="pin-dots" style="display: flex; justify-content: center; gap: 15px; margin-bottom: 25px;">
            <div class="pin-dot"></div><div class="pin-dot"></div><div class="pin-dot"></div><div class="pin-dot"></div>
        </div>
        <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 15px;">
            <button class="btn-numpad" onclick="tekanNumpad('1', event)">1</button>
            <button class="btn-numpad" onclick="tekanNumpad('2', event)">2</button>
            <button class="btn-numpad" onclick="tekanNumpad('3', event)">3</button>
            <button class="btn-numpad" onclick="tekanNumpad('4', event)">4</button>
            <button class="btn-numpad" onclick="tekanNumpad('5', event)">5</button>
            <button class="btn-numpad" onclick="tekanNumpad('6', event)">6</button>
            <button class="btn-numpad" onclick="tekanNumpad('7', event)">7</button>
            <button class="btn-numpad" onclick="tekanNumpad('8', event)">8</button>
            <button class="btn-numpad" onclick="tekanNumpad('9', event)">9</button>
            <button class="btn-numpad special" onclick="tutupPinModal(event)">Batal</button>
            <button class="btn-numpad" onclick="tekanNumpad('0', event)">0</button>
            <button class="btn-numpad special" style="background: var(--pink);" onclick="tekanNumpad('del', event)">⌫</button>
        </div>
        <p id="pin-error-text" style="color: #ef4444; font-weight: bold; font-size: 1.1rem; height: 20px; margin: 0; visibility: hidden; background: #fee2e2; border-radius: 10px; border: 2px solid #ef4444;">PIN Salah!</p>
    </div>
</div>
</body>
</html>
