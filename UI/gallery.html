<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gallery Manager - Lacasabooth</title>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600;700&family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/assets/theme.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Fredoka', sans-serif; }
        
        body {
            background-color: var(--bg-color); 
            background-image: radial-gradient(var(--dot-color) 2px, transparent 2px);
            background-size: 40px 40px;
            color: var(--ink); min-height: 100vh; display: flex; flex-direction: column;
        }

        /* HEADER & NAVBAR */
        .top-bar { 
            display: flex; justify-content: space-between; align-items: center; 
            padding: 20px 40px; background: var(--paper-white); 
            border-bottom: 3px dashed var(--ink);
            position: sticky; top: 0; z-index: 100;
            box-shadow: 0px 4px 0px rgba(0,0,0,0.05);
        }
        
        .header-title { font-family: 'Caveat', cursive; font-size: 2.2rem; font-weight: 700; color: var(--ink); }
        
        .btn-back {
            background: var(--paper-white); color: var(--ink); border: 2px solid var(--ink); 
            padding: 8px 20px; border-radius: 50px; font-weight: 600; cursor: pointer; 
            transition: 0.2s; text-decoration: none; display: inline-flex; align-items: center; gap: 8px;
            box-shadow: 3px 3px 0px var(--ink);
        }
        .btn-back:hover { background: var(--yellow); transform: translateY(-2px); box-shadow: 5px 5px 0px var(--ink); }

        /* TOOLBAR AKSI */
        .toolbar-wrapper {
            position: sticky; top: 85px; z-index: 90; background: var(--bg-color);
            padding: 15px 40px; border-bottom: 2px solid rgba(0,0,0,0.05);
        }
        .toolbar {
            display: flex; gap: 12px; align-items: center; flex-wrap: wrap;
            background: var(--paper-white); padding: 15px; border-radius: 20px;
            border: 3px solid var(--ink); box-shadow: 4px 4px 0px rgba(0,0,0,0.1);
        }
        
        .btn-toolbar { 
            padding: 10px 18px; border-radius: 12px; border: 2px solid var(--ink); 
            background: #fff; font-weight: 600; font-size: 0.9rem; cursor: pointer; 
            display: flex; align-items: center; gap: 8px; transition: 0.2s; color: var(--ink);
            box-shadow: 2px 2px 0px var(--ink);
        }
        .btn-toolbar:hover { transform: translateY(-2px); box-shadow: 4px 4px 0px var(--ink); background: var(--bg-color); }
        
        .btn-danger { background: var(--pink); }
        .btn-print { background: var(--blue); }
        .btn-usb { background: var(--green); }

        .status-text { 
            font-weight: 700; color: var(--ink); font-size: 0.95rem; margin-left: auto; 
            background: var(--yellow); padding: 8px 20px; border-radius: 12px; 
            border: 2px dashed var(--ink);
        }

        /* GRID FOTO & FOLDER */
        .gallery-container { padding: 20px 40px 40px 40px; flex-grow: 1; }
        
        .folder-section { margin-bottom: 40px; background: rgba(255,255,255,0.5); padding: 20px; border-radius: 25px; border: 2px dashed #cbd5e1; }
        .folder-title { 
            font-family: 'Caveat', cursive; font-size: 2rem; color: var(--ink); 
            margin-bottom: 20px; display: flex; align-items: center; gap: 10px;
            border-bottom: 2px solid var(--ink); padding-bottom: 10px; width: fit-content;
        }

        .gallery-grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); 
            gap: 20px; 
        }
        
        /* CARD FOTO */
        .g-item { 
            position: relative; border-radius: 15px; overflow: hidden; cursor: pointer; 
            border: 3px solid var(--ink); transition: 0.2s; background: var(--paper-white); 
            aspect-ratio: 3/4; box-shadow: 4px 4px 0px rgba(0,0,0,0.1);
        }
        .g-item img { width: 100%; height: 100%; object-fit: cover; transition: 0.3s; }
        .g-item:hover { transform: translateY(-4px); box-shadow: 6px 6px 0px var(--ink); }
        
        .g-item.selected { border-color: var(--blue); border-width: 4px; box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.3); }
        .g-item.selected img { transform: scale(1.05); filter: brightness(0.85); }
        
        .g-checkbox { 
            position: absolute; top: 10px; right: 10px; width: 30px; height: 30px; 
            border: 3px solid var(--ink); border-radius: 8px; background: var(--paper-white); 
            transition: 0.2s; display: flex; align-items: center; justify-content: center;
        }
        .g-item.selected .g-checkbox { background: var(--blue); border-color: var(--ink); }
        .g-item.selected .g-checkbox::after { content: "✓"; color: var(--ink); font-weight: 900; font-size: 18px; }
        
        .empty-state { text-align: center; color: var(--ink); padding: 50px 0; font-size: 1.2rem; font-weight: 600; width: 100%; }
        
        .file-name { 
            position: absolute; bottom: 0; left: 0; width: 100%; background: var(--paper-white); 
            padding: 8px; font-size: 0.75rem; font-weight: 600; color: var(--ink); 
            text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
            border-top: 2px solid var(--ink);
        }

        /* RESPONSIVE MOBILE */
        @media (max-width: 768px) {
            .top-bar { padding: 15px 20px; flex-direction: column; gap: 10px; }
            .toolbar-wrapper { padding: 10px 15px; top: 110px; }
            .toolbar { justify-content: center; }
            .btn-toolbar { flex: 1 1 calc(50% - 12px); justify-content: center; font-size: 0.8rem; padding: 8px; }
            .status-text { width: 100%; text-align: center; }
            .gallery-container { padding: 15px; }
            .gallery-grid { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 15px; }
            .folder-section { padding: 15px; }
        }
    </style>
</head>
<body>

    <div class="top-bar">
        <div class="header-title">📸 Gallery Data</div>
        <a href="/dashboard.html" class="btn-back">‹ Kembali ke Dashboard</a>
    </div>

    <div class="toolbar-wrapper">
        <div class="toolbar">
            <button class="btn-toolbar" onclick="selectAllPhotos()">☑ Pilih Semua</button>
            <button class="btn-toolbar" onclick="unselectAllPhotos()">☐ Batal</button>
            
            <button class="btn-toolbar btn-print" onclick="printSelectedPhotos('4R')">🖨️ Cetak 4R</button>
            <button class="btn-toolbar btn-print" onclick="printSelectedPhotos('A4')">🖨️ Cetak A4</button>
            
            <button class="btn-toolbar btn-usb" onclick="exportToPictures()">💾 Export ke 'Pictures'</button>
            <button class="btn-toolbar btn-danger" onclick="deleteSelectedPhotos()">🗑️ Hapus</button>
            
            <div class="status-text" id="selectedCount">0 Foto Terpilih</div>
        </div>
    </div>

    <div class="gallery-container" id="mainGalleryContainer">
        <div class="empty-state">⏳ Sedang memuat galeri...</div>
    </div>

    <script>
        // === CUSTOM TOAST ALERT & CONFIRM (Anti-Bug Focus) ===
        window.alert = function(pesan) {
            let container = document.getElementById('custom-toast-container');
            if (!container) {
                container = document.createElement('div');
                container.id = 'custom-toast-container';
                container.style.cssText = 'position:fixed; bottom:40px; left:50%; transform:translateX(-50%); z-index:999999; display:flex; flex-direction:column; gap:10px; pointer-events:none;';
                document.body.appendChild(container);
            }
            const toast = document.createElement('div');
            let bgColor = 'var(--ink)';
            if (pesan.toLowerCase().includes('gagal') || pesan.toLowerCase().includes('error') || pesan.includes('❌') || pesan.includes('minimal')) bgColor = '#ef4444';
            else if (pesan.toLowerCase().includes('berhasil') || pesan.includes('✅') || pesan.includes('selesai')) bgColor = '#10b981';

            toast.style.cssText = `background:${bgColor}; color:white; padding:12px 30px; border-radius:50px; font-weight:600; font-size:1rem; box-shadow:0 10px 15px -3px rgba(0,0,0,0.3); border:2px solid #fff; text-align:center; transition: all 0.3s; opacity: 0; transform: translateY(30px); font-family: 'Fredoka', sans-serif;`;
            toast.innerHTML = pesan.replace(/\n/g, '<br>');
            container.appendChild(toast);
            requestAnimationFrame(() => { toast.style.opacity = '1'; toast.style.transform = 'translateY(0)'; });
            setTimeout(() => { toast.style.opacity = '0'; toast.style.transform = 'translateY(20px)'; setTimeout(() => toast.remove(), 300); }, 3500);
        };

        const fungsiConfirmAsli = window.confirm;
        window.confirm = function(pesan) {
            const hasil = fungsiConfirmAsli(pesan);
            setTimeout(() => { window.focus(); document.body.focus(); }, 50);
            return hasil;
        };
        // =======================================================

        fetch('/api/settings').then(res => res.json()).then(data => {
            if (data.global && data.global.theme) document.body.className = data.global.theme;
        }).catch(e => console.error("Gagal memuat tema:", e));

        let selectedPhotos = [];
        let allAvailablePhotos = [];

        async function loadGallery() {
            const container = document.getElementById('mainGalleryContainer');
            try {
                const res = await fetch('/api/gallery');
                const data = await res.json();
                
                if(!data.files || data.files.length === 0) {
                    container.innerHTML = '<div class="empty-state">📭 Belum ada foto yang tersimpan di sistem.</div>';
                    allAvailablePhotos = [];
                    return;
                }

                allAvailablePhotos = data.files.map(f => f.name);
                container.innerHTML = '';
                
                // KELOMPOKKAN FILE BERDASARKAN TANGGAL (Folder)
                const folders = {};
                data.files.forEach(file => {
                    let folderName = "File Lainnya";
                    // Cari pola YYYYMMDD di nama file (Format standar Lacasabooth)
                    const match = file.name.match(/^(\d{4})(\d{2})(\d{2})/);
                    if (match) {
                        folderName = `${match[3]}-${match[2]}-${match[1]}`; // Ubah ke DD-MM-YYYY
                    }
                    if(!folders[folderName]) folders[folderName] = [];
                    folders[folderName].push(file);
                });

                // Urutkan Folder (Terbaru di atas)
                const sortedFolderNames = Object.keys(folders).sort((a, b) => {
                    if(a === "File Lainnya") return 1; if(b === "File Lainnya") return -1;
                    const dateA = a.split('-').reverse().join('');
                    const dateB = b.split('-').reverse().join('');
                    return dateB.localeCompare(dateA); // Descending
                });

                // Render UI Berbentuk Folder
                sortedFolderNames.forEach(folderName => {
                    let folderSection = document.createElement('div');
                    folderSection.className = 'folder-section';
                    
                    let folderHTML = `<h3 class="folder-title">📁 Sesi: ${folderName}</h3><div class="gallery-grid">`;
                    
                    // Render foto di dalam grid folder
                    folders[folderName].forEach(file => {
                        const isSelected = selectedPhotos.includes(file.name) ? 'selected' : '';
                        folderHTML += `
                            <div class="g-item ${isSelected}" id="item-${file.name.replace(/\./g, '-')}" onclick="togglePhoto('${file.name}')">
                                <img src="/uploads/${file.name}" loading="lazy" alt="${file.name}">
                                <div class="g-checkbox"></div>
                                <div class="file-name">${file.name}</div>
                            </div>
                        `;
                    });
                    
                    folderHTML += `</div>`;
                    folderSection.innerHTML = folderHTML;
                    container.appendChild(folderSection);
                });

            } catch (e) {
                container.innerHTML = '<div class="empty-state">❌ Gagal memuat galeri dari server.</div>';
            }
        }

        function togglePhoto(filename) {
            const index = selectedPhotos.indexOf(filename);
            const el = document.getElementById(`item-${filename.replace(/\./g, '-')}`);
            if (index > -1) {
                selectedPhotos.splice(index, 1);
                el.classList.remove('selected');
            } else {
                selectedPhotos.push(filename);
                el.classList.add('selected');
            }
            updateSelectionUI();
        }

        function selectAllPhotos() {
            selectedPhotos = [...allAvailablePhotos];
            document.querySelectorAll('.g-item').forEach(el => el.classList.add('selected'));
            updateSelectionUI();
        }

        function unselectAllPhotos() {
            selectedPhotos = [];
            document.querySelectorAll('.g-item').forEach(el => el.classList.remove('selected'));
            updateSelectionUI();
        }

        function updateSelectionUI() {
            document.getElementById('selectedCount').innerText = `${selectedPhotos.length} Foto Terpilih`;
        }

        async function deleteSelectedPhotos() {
            if (selectedPhotos.length === 0) return alert("Pilih minimal satu foto untuk dihapus!");
            if (confirm(`Yakin ingin MENGHAPUS PERMANEN ${selectedPhotos.length} foto terpilih?`)) {
                try {
                    await fetch('/api/delete-photos', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ files: selectedPhotos })
                    });
                    selectedPhotos = [];
                    updateSelectionUI();
                    loadGallery(); 
                    alert("✅ Foto berhasil dihapus!");
                } catch (e) { alert("❌ Gagal menghapus foto!"); }
            }
        }

        async function printSelectedPhotos(printSize) {
            if (selectedPhotos.length === 0) return alert("Pilih minimal satu foto untuk dicetak!");
            
            const buttons = document.querySelectorAll('.btn-toolbar');
            buttons.forEach(btn => { btn.disabled = true; btn.style.opacity = '0.5'; });

            document.getElementById('selectedCount').innerText = `⏳ Mengirim ${selectedPhotos.length} foto...`;
            
            for (let i = 0; i < selectedPhotos.length; i++) {
                try {
                    await fetch('/api/print', { 
                        method: 'POST', 
                        headers: {'Content-Type': 'application/json'}, 
                        body: JSON.stringify({ fileName: selectedPhotos[i], size: printSize, action: 'print' }) 
                    });
                    await new Promise(resolve => setTimeout(resolve, 300));
                } catch (e) { console.error("Gagal mencetak foto:", selectedPhotos[i]); }
            }

            alert(`✅ Selesai! ${selectedPhotos.length} foto (${printSize}) masuk ke antrean cetak.`);
            
            buttons.forEach(btn => { btn.disabled = false; btn.style.opacity = '1'; });
            unselectAllPhotos();
        }

       // FUNGSI BARU: EXPORT KE FOLDER PICTURES
        async function exportToPictures() {
            if (selectedPhotos.length === 0) return alert("Pilih minimal satu foto untuk di-export!");
            
            const konfirmasi = confirm(`Salin ${selectedPhotos.length} foto terpilih ke folder 'Pictures' di komputer ini?`);
            if(!konfirmasi) return;

            const btn = document.querySelector('.btn-usb');
            const originalText = btn.innerHTML;
            btn.innerHTML = "⏳ Sedang Menyalin...";
            btn.disabled = true;

            try {
                const res = await fetch('/api/export-pictures', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ files: selectedPhotos })
                });
                const data = await res.json();
                
                if (data.success) {
                    alert(`✅ Export Selesai!\n${selectedPhotos.length} foto berhasil disalin.\n\nFolder Pictures akan terbuka secara otomatis!`);
                    unselectAllPhotos();
                } else {
                    alert("❌ Gagal Export: " + (data.message || "Terjadi kesalahan sistem."));
                }
            } catch (e) {
                alert("❌ Terjadi kesalahan koneksi saat mencoba menyalin file.");
            }

            btn.innerHTML = originalText;
            btn.disabled = false;
        }
        window.onload = loadGallery;
    </script>
</body>
</html>
